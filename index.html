<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InnerScore">
  <title>InnerScore</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">InnerScore</h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Log today">＋</button>

  <nav class="tabbar">
    <button data-tab="calendar" class="active"><span>📅</span>Calendar</button>
    <button data-tab="trends"><span>📈</span>Trends</button>
    <button data-tab="categories"><span>🎨</span>Categories</button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
